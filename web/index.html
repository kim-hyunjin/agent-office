<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pawgents Office</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'><rect x='2' y='0' width='2' height='2' fill='%238a4a24'/><rect x='12' y='0' width='2' height='2' fill='%238a4a24'/><rect x='2' y='2' width='4' height='2' fill='%238a4a24'/><rect x='10' y='2' width='4' height='2' fill='%238a4a24'/><rect x='2' y='4' width='4' height='2' fill='%23c0703a'/><rect x='6' y='4' width='4' height='2' fill='%237a3f1d'/><rect x='10' y='4' width='4' height='2' fill='%23c0703a'/><rect x='2' y='6' width='2' height='2' fill='%23c0703a'/><rect x='4' y='6' width='2' height='2' fill='%239bc53d'/><rect x='6' y='6' width='4' height='2' fill='%23c0703a'/><rect x='10' y='6' width='2' height='2' fill='%239bc53d'/><rect x='12' y='6' width='2' height='2' fill='%23c0703a'/><rect x='2' y='8' width='2' height='2' fill='%23c0703a'/><rect x='4' y='8' width='2' height='2' fill='%23f0d2b0'/><rect x='6' y='8' width='4' height='2' fill='%23c0505a'/><rect x='10' y='8' width='2' height='2' fill='%23f0d2b0'/><rect x='12' y='8' width='2' height='2' fill='%23c0703a'/><rect x='4' y='10' width='2' height='2' fill='%23c0703a'/><rect x='6' y='10' width='4' height='2' fill='%23e8b98a'/><rect x='10' y='10' width='2' height='2' fill='%23c0703a'/><rect x='2' y='12' width='4' height='2' fill='%23c0703a'/><rect x='6' y='12' width='4' height='2' fill='%23e8b98a'/><rect x='10' y='12' width='4' height='2' fill='%23c0703a'/><rect x='2' y='14' width='4' height='2' fill='%23c0703a'/><rect x='6' y='14' width='4' height='2' fill='%23e8b98a'/><rect x='10' y='14' width='4' height='2' fill='%23c0703a'/></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="stage">
  <canvas id="office" width="512" height="320"></canvas>
</main>
<dialog id="launcher">
  <form id="l-form" method="dialog">
    <h2>새 직원 채용</h2>
    <label>워크트리
      <select id="l-worktree" required><option value="">불러오는 중…</option></select>
    </label>
    <label>모델 <span class="dim">(비우면 기본값)</span>
      <input id="l-model" list="l-models" placeholder="opus / sonnet / haiku / 모델 ID" autocomplete="off">
      <datalist id="l-models"><option value="opus"><option value="sonnet"><option value="haiku"></datalist>
    </label>
    <label>첫 지시 <span class="dim">(선택)</span>
      <textarea id="l-prompt" rows="5" placeholder="무엇을 할지 적어주세요. 비우면 빈 세션으로 시작합니다."></textarea>
    </label>
    <p id="l-msg" class="msg"></p>
    <div class="row">
      <button type="button" id="l-cancel">취소</button>
      <button type="submit" id="l-submit" class="primary">시작</button>
    </div>
  </form>
</dialog>
<dialog id="reply">
  <header>
    <div>
      <h2 id="r-name"></h2>
      <p id="r-meta" class="dim"></p>
    </div>
    <button type="button" id="r-copy" title="마크다운 원문 복사">복사</button>
    <button type="button" id="r-close" title="닫기 (Esc)">×</button>
  </header>
  <article id="r-body" class="md"></article>
</dialog>
<dialog id="legend">
  <header>
    <h2>모델 안내</h2>
    <button type="button" id="lg-close" title="닫기 (Esc)">×</button>
  </header>
  <div id="lg-body"></div>
</dialog>
<aside id="roster" hidden>
  <header>
    <h2>직원 목록 <span id="rs-count" class="dim"></span></h2>
    <button type="button" id="rs-close" title="닫기">×</button>
  </header>
  <ul id="rs-list"></ul>
</aside>
<div id="tip" hidden></div>
<div id="ticker"><ul id="ticker-list"></ul></div>
<aside id="panel">
  <header>
    <div class="hd">
      <h2 id="p-name"></h2>
      <span id="p-state" class="badge"></span>
      <button id="p-quit" type="button" title="이 세션 종료">퇴근</button>
    </div>
    <p id="p-title"></p>
    <button id="p-close" title="닫기 (Esc)">×</button>
  </header>
  <div id="p-scroll">
    <dl id="p-meta"></dl>
    <blockquote id="p-prompt" class="prompt" hidden></blockquote>
    <p id="p-thinking" class="thinking" hidden></p>
    <div id="p-agents" hidden></div>
    <blockquote id="p-last" title="클릭해서 크게 보기" tabindex="0" hidden></blockquote>
    <div id="p-files"></div>
    <h3>활동 로그</h3>
    <ul id="p-log"></ul>
  </div>
  <form id="p-compose">
    <textarea id="p-input" rows="2" placeholder="이 직원에게 지시…  (Enter 보내기 · Shift+Enter 줄바꿈)"></textarea>
    <div class="row">
      <span id="p-compose-msg" class="msg"></span>
      <button type="submit" id="p-send" class="primary">보내기</button>
    </div>
  </form>
</aside>
<script type="module" src="office.js"></script>
</body>
</html>
